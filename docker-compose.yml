services:
  # --- SQL Server Database ---
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: smartitsm-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql # Persist database data
    networks:
      - smartitsm-network

  # --- .NET Backend API ---
  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: smartitsm-api
    depends_on:
      - db
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=${DB_NAME};User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;
      - JwtSettings__Key=${JWT_SECRET}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - Gemini__ApiKey=${GEMINI_API_KEY}
      - FrontendSettings__BaseUrl=${FRONTEND_BASE_URL}
      - SmtpSettings__Host=${SMTP_HOST}
      - SmtpSettings__Port=${SMTP_PORT}
      - SmtpSettings__Username=${SMTP_USERNAME}
      - SmtpSettings__Password=${SMTP_PASSWORD}
      - SmtpSettings__FromEmail=${SMTP_FROM_EMAIL}
      - SmtpSettings__FromName=${SMTP_FROM_NAME}
      - SmtpSettings__EnableSsl=${SMTP_ENABLE_SSL}
      - SmtpSettings__EnableEmails=${SMTP_ENABLE_EMAILS}
      - ASPNETCORE_ENVIRONMENT=Production
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - smartitsm-network

  # --- Vite/React Frontend ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
    container_name: smartitsm-ui
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - smartitsm-network

networks:
  smartitsm-network:
    driver: bridge

volumes:
  mssql-data:
